[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/supabase"
  to = "/.netlify/functions/supabase"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

